<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABIT - 로그인</title>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Custom CSS -->
    <link rel="stylesheet" href="../assets/css/main.css">
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen flex items-center justify-center">
<div class="container mx-auto px-4">
    <div class="max-w-md mx-auto">
        <!-- 로고 및 타이틀 -->
        <div class="text-center mb-8">
            <div class="inline-block bg-white p-4 rounded-full shadow-lg mb-4">
                <svg class="w-16 h-16 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.75 17L9 20l-1 1h8l-1-1-.75-3M3 13h18M5 17h14a2 2 0 002-2V5a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"></path>
                </svg>
            </div>
            <h1 class="text-4xl font-bold text-gray-800 mb-2">LABIT</h1>
            <p class="text-gray-600">AIoT 교육 플랫폼</p>
        </div>

        <!-- 로그인 카드 -->
        <div class="bg-white rounded-2xl shadow-2xl p-8">
            <h2 class="text-2xl font-bold text-gray-800 mb-6 text-center">로그인</h2>

            <!-- 알림 메시지 영역 -->
            <div id="alert-message" class="hidden mb-4 p-4 rounded-lg"></div>

            <!-- 로그인 폼 -->
            <form id="login-form">
                <!-- 이메일 입력 -->
                <div class="mb-4">
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">
                        이메일
                    </label>
                    <input
                            type="email"
                            id="email"
                            name="email"
                            required
                            placeholder="example@labit.com"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200"
                    >
                </div>

                <!-- 비밀번호 입력 -->
                <div class="mb-6">
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">
                        비밀번호
                    </label>
                    <input
                            type="password"
                            id="password"
                            name="password"
                            required
                            placeholder="••••••••"
                            class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent transition duration-200"
                    >
                </div>

                <!-- 로그인 버튼 -->
                <button
                        type="submit"
                        id="login-button"
                        class="w-full bg-indigo-600 text-white py-3 rounded-lg font-semibold hover:bg-indigo-700 transition duration-200 shadow-lg hover:shadow-xl transform hover:-translate-y-0.5"
                >
                    로그인
                </button>
            </form>

            <!-- 구분선 -->
            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center">
                    <div class="w-full border-t border-gray-300"></div>
                </div>
                <div class="relative flex justify-center text-sm">
                    <span class="px-4 bg-white text-gray-500">또는</span>
                </div>
            </div>

            <!-- 회원가입 링크 -->
            <div class="text-center">
                <p class="text-gray-600">
                    계정이 없으신가요?
                    <a href="register.html" class="text-indigo-600 hover:text-indigo-700 font-semibold">
                        회원가입
                    </a>
                </p>
            </div>

            <!-- MVP 테스트용 샘플 계정 안내 -->
            <div class="mt-6 p-4 bg-yellow-50 border border-yellow-200 rounded-lg">
                <p class="text-sm text-yellow-800 font-medium mb-2">MVP 테스트 계정</p>
                <p class="text-xs text-yellow-700">
                    Email: test@labit.com<br>
                    Password: test1234
                </p>
            </div>
        </div>

        <!-- Footer -->
        <div class="text-center mt-6 text-gray-500 text-sm">
            <p>&copy; 2025 LABIT. All rights reserved.</p>
        </div>
    </div>
</div>

<!-- JavaScript -->
<script type="module" src="../js/pages/login.js"></script>
</body>
</html>
