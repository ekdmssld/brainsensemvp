<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LABIT - 코딩</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="../assets/css/main.css">

    <style>
        .code-container {
            background: #1e1e1e;
            color: #d4d4d4;
            font-family: 'Consolas', 'Monaco', 'Courier New', monospace;
            font-size: 14px;
            line-height: 1.6;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            max-height: 600px;
        }

        .question-card {
            transition: all 0.3s ease;
        }

        .question-card.active {
            border-color: #4f46e5;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.2);
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s steps(4, end) infinite;
        }

        @keyframes dots {
            0%, 20% { content: '.'; }
            40% { content: '..'; }
            60%, 100% { content: '...'; }
        }
    </style>
</head>
<body class="bg-gray-50">
<!-- Header -->
<header class="bg-white shadow-sm sticky top-0 z-50">
    <div class="container mx-auto px-6 py-4">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-4">
                <h1 class="text-2xl font-bold text-indigo-600">LABIT</h1>
                <span class="text-gray-300">|</span>
                <span class="text-gray-800 font-semibold" id="kit-name">키트명</span>
            </div>
            <div class="flex items-center space-x-4">
                <div class="text-right">
                    <p class="text-sm font-medium text-gray-700" id="user-name"></p>
                </div>
                <button id="logout-btn" class="px-4 py-2 text-sm text-gray-600 hover:text-gray-800 hover:bg-gray-100 rounded-lg transition">
                    로그아웃
                </button>
            </div>
        </div>
    </div>
</header>

<!-- Progress Bar -->
<div class="bg-white border-b">
    <div class="container mx-auto px-6 py-3">
        <div class="flex items-center justify-between">
            <div class="flex items-center space-x-2 opacity-50">
                <div class="w-8 h-8 bg-indigo-600 text-white rounded-full flex items-center justify-center text-sm">✓</div>
                <span class="text-sm text-gray-500">브레인스토밍</span>
            </div>
            <div class="flex-1 h-1 bg-indigo-600 mx-4"></div>
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 bg-indigo-600 text-white rounded-full flex items-center justify-center text-sm font-semibold">4</div>
                <span class="text-sm font-medium text-indigo-600">코딩</span>
            </div>
            <div class="flex-1 h-1 bg-gray-200 mx-4"></div>
            <div class="flex items-center space-x-2 opacity-50">
                <div class="w-8 h-8 bg-gray-300 text-white rounded-full flex items-center justify-center text-sm">5</div>
                <span class="text-sm text-gray-500">AI 튜터</span>
            </div>
        </div>
    </div>
</div>

<!-- Main Content -->
<main class="container mx-auto px-6 py-8">
    <div class="text-center mb-8">
        <h2 class="text-3xl font-bold text-gray-800 mb-3">질문에 답하고 AI 코드를 생성하세요</h2>
        <p class="text-gray-600">질문에 답변하면 AI가 자동으로 아두이노 코드를 생성합니다</p>
    </div>

    <!-- Alert Message -->
    <div id="alert-message" class="hidden mb-6"></div>

    <!-- Ollama Status -->
    <div id="ollama-status" class="hidden mb-6 p-4 rounded-lg"></div>

    <!-- Layout: Questions (Left) | Code (Right) -->
    <div class="grid grid-cols-1 lg:grid-cols-5 gap-6">
        <!-- Questions Panel (40%) -->
        <div class="lg:col-span-2">
            <div class="bg-white rounded-xl shadow-md p-6 sticky top-24">
                <h3 class="text-xl font-bold text-gray-800 mb-4">💡 IoT 시스템 설계 질문</h3>

                <div id="questions-container" class="space-y-4">
                    <!-- Questions will be generated here -->
                </div>

                <button
                        id="generate-code-btn"
                        class="w-full mt-6 px-6 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition shadow-lg disabled:opacity-50 disabled:cursor-not-allowed"
                >
                    🤖 AI 코드 생성하기
                </button>

                <p class="text-xs text-gray-500 mt-3 text-center">
                    모든 질문에 답변하면 코드 생성이 가능합니다
                </p>
            </div>
        </div>

        <!-- Code Panel (60%) -->
        <div class="lg:col-span-3">
            <div class="bg-white rounded-xl shadow-md overflow-hidden">
                <!-- Code Header -->
                <div class="bg-gray-800 px-6 py-3 flex items-center justify-between">
                    <div class="flex items-center space-x-2">
                        <span class="text-green-400 font-mono text-sm">●</span>
                        <span class="text-white font-semibold">Arduino Code</span>
                    </div>
                    <button
                            id="copy-code-btn"
                            class="hidden px-3 py-1 bg-gray-700 text-white text-sm rounded hover:bg-gray-600 transition"
                    >
                        📋 복사
                    </button>
                </div>

                <!-- Code Display -->
                <div id="code-display" class="code-container">
                    <div class="text-gray-500 text-center py-12">
                        <svg class="w-16 h-16 mx-auto mb-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"></path>
                        </svg>
                        <p>질문에 답변하고 "AI 코드 생성하기" 버튼을 눌러주세요</p>
                    </div>
                </div>

                <!-- Loading Overlay -->
                <div id="code-loading" class="hidden absolute inset-0 bg-black bg-opacity-50 flex items-center justify-center">
                    <div class="bg-white rounded-lg p-8 text-center">
                        <div class="spinner mx-auto mb-4"></div>
                        <p class="text-gray-700 font-semibold">AI가 코드를 생성하는 중<span class="loading-dots"></span></p>
                        <p class="text-sm text-gray-500 mt-2">잠시만 기다려주세요 (약 10-30초)</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Navigation Buttons -->
    <div class="flex justify-between items-center mt-8">
        <button id="back-btn" class="px-6 py-3 bg-gray-200 text-gray-700 rounded-lg font-semibold hover:bg-gray-300 transition">
            ← 이전 단계
        </button>
        <button id="next-btn" class="hidden px-6 py-3 bg-indigo-600 text-white rounded-lg font-semibold hover:bg-indigo-700 transition shadow-lg">
            다음 단계로 →
        </button>
    </div>
</main>

<script type="module" src="../js/pages/step4-coding.js"></script>
</body>
</html>
